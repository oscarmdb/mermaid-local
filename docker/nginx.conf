# Mermaid Editor - nginx Configuration
# 
# SECURITY FEATURES:
# - Strict Content-Security-Policy blocking all external resources
# - X-Frame-Options DENY preventing clickjacking
# - X-Content-Type-Options nosniff preventing MIME sniffing
# - Referrer-Policy no-referrer preventing data leakage
# - All responses served from local files only

# Run as non-root user
user app;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    # Basic settings
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Security: Hide nginx version
    server_tokens off;
    
    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;
    
    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        
        # =============================================
        # SECURITY HEADERS
        # =============================================
        
        # Content Security Policy - STRICT
        # Only allows resources from same origin ('self')
        # Blocks ALL external network requests
        add_header Content-Security-Policy "
            default-src 'self';
            script-src 'self' 'unsafe-inline' 'unsafe-eval';
            style-src 'self' 'unsafe-inline';
            img-src 'self' data: blob:;
            font-src 'self' data:;
            connect-src 'self';
            worker-src 'self' blob:;
            frame-ancestors 'none';
            form-action 'self';
            base-uri 'self';
            object-src 'none';
            upgrade-insecure-requests;
        " always;
        
        # Prevent clickjacking
        add_header X-Frame-Options "DENY" always;
        
        # Prevent MIME type sniffing
        add_header X-Content-Type-Options "nosniff" always;
        
        # XSS Protection (legacy but still useful)
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Referrer Policy - don't leak referrer data
        add_header Referrer-Policy "no-referrer" always;
        
        # Permissions Policy - disable unnecessary features
        add_header Permissions-Policy "
            camera=(),
            microphone=(),
            geolocation=(),
            payment=(),
            usb=(),
            magnetometer=(),
            gyroscope=(),
            accelerometer=()
        " always;
        
        # =============================================
        # CACHING
        # =============================================
        
        # Cache static assets aggressively
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            # Re-add security headers (add_header in location blocks overrides parent)
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        
        # =============================================
        # ROUTING
        # =============================================
        
        # SPA fallback - serve index.html for all routes
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Block access to hidden files
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }
        
        # Error pages
        error_page 404 /index.html;
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
